name: Format check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Stage clang-format where the script expects it
        run: |
          mkdir -p build/bin
          ln -s "$(command -v clang-format)" build/bin/clang-format

      - name: Run formatter
        run: sh yk_format_new_files.sh

      - name: Verify no formatting changes
        run: git diff --exit-code
